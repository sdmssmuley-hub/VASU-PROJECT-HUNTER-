name: Vasu Project Hunter

on:
  schedule:
    # 09:00-18:00 IST hourly = 03:30-12:30 UTC hourly (IST = UTC+5:30).
    # Fires 10 times/day: 09:00, 10:00, ... 18:00 IST.
    - cron: '30 3-12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'run-once'
        type: choice
        options: ['run-once', 'test-telegram', 'health-check']

# Section 44 "run lock": GitHub's own concurrency queueing prevents two
# hunter runs from executing at the same time - if a run is still going
# when the next trigger fires, the new one waits instead of overlapping.
concurrency:
  group: vasu-project-hunter
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run hunter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode || 'run-once' }}"
          if [ "$MODE" = "test-telegram" ]; then
            python -m src.main --test-telegram
          elif [ "$MODE" = "health-check" ]; then
            python -m src.main --health-check
          else
            python -m src.main --run-once
          fi

      - name: Commit updated database
        if: always()
        run: |
          git config user.name "vasu-project-hunter-bot"
          git config user.email "actions@github.com"
          git add data/vasu_hunter.db || true
          git diff --cached --quiet || git commit -m "chore: update hunter database [skip ci]"
          git push || true
